<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/script.js"></script>
  <title>Vocab Bridge | English-Farsi Learning</title>
</head>

<body>

  <nav>

    <div>
      <img src="assets/images/main-logo.jpg" alt="Vocab Bridge Logo">
      <p>
        <strong>Voacb Bridge</strong> <br> Learn English
      </p>
    </div>

    <div class="language-switch">
      <img src="assets/images/language-switch.jpg" alt="Language Switch">
    </div>

    <div class="day-night-toggle">
      <img src="day-night-toggle.jpg" alt="Day Night Toggle">
    </div>

  </nav>

  <main>

    <button class="skip-button">Skip to Content</button>

    <div class="card-counter">
      <p>Card 3 of 20</p>
    </div>

    <div class="main-card">

      <div class="top-button-sign">
        <div>
          <button class="voice-sign">V</button>
        </div>
        <div>
          <button class="repeat-sign">R</button>
        </div>
      </div>

      <div class="words-btn-container">
        <div class="test-word-container">
          <p class="test-word">friend</p>
        </div>
        <div class="test-translation">
          <p>دوست</p>
        </div>
        <div>
          <button class="flip-card-btn">
            Flip Card
          </button>
        </div>
      </div>
    </div>

    <div class="previous-next-btn">
      <button class="order-btn">
        <p><= Previous</p>
      </button>
      <button class="order-btn">
        <p>Next =></p>
      </button>
    </div>

    <div class="result-card">
      <div class="correct-div">
        <p>
          Correct: 15
        </p>
      </div>
      <div class="wrong-div">
        <p>
          Wrong: 5
        </p>
      </div>
      <div>
        <p>
          Overall Progress
        </p>
      </div>
    </div>
    
  </main>

  <footer>
    <img src="" alt="Github">
    <img src="" alt="LinkedIn">
    <p class="footer-p">2026 | VocabBridge - Ali Armani</p>
  </footer>
  
</body>

</html>
