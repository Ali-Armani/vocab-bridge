<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/script.js" defer></script>
  <title>Vocab Bridge | English-Farsi Learning</title>
</head>

<body>

  <a href="#main-content" class="skip-link">Skip to Content</a>

  <nav>

    <div class="logo-container">
      <img src="assets/images/vocab-bridge-logo.jpg" alt="Vocab Bridge Logo" class="vocab-bridge-logo">
      <p>
        <strong>Voacb Bridge</strong> <br> Learn English
      </p>
    </div>

    <div class="language-switch">
      <img src="assets/images/language-switch.jpg" alt="Language Switch">
    </div>

    <div class="day-night-toggle">
      <img src="assets/images/day-night-toggle.jpg" alt="Toggle dark and light mode">
    </div>

  </nav>

  <main id="main-content">

    <div class="card-counter" aria-live="polite">
      <p>Card 3 of 20</p>
    </div>

    <div class="main-card">

      <div class="top-button-sign">
        <div>
          <button class="voice-sign" aria-label="Play pronunciation">V</button>
        </div>
        <div>
          <button class="repeat-sign" aria-label="Repeat">R</button>
        </div>
      </div>

      <div class="words-btn-container">
        <div class="test-word-container">
          <p class="test-word">friend</p>
        </div>
        <div class="test-translation">
          <p lang="fa" dir="rtl">دوست</p>
        </div>
        <div>
          <button class="flip-card-btn">
            Flip Card
          </button>
        </div>
      </div>
    </div>

    <div class="previous-next-btn">
      <button class="order-btn">
        <p><= Previous</p>
      </button>
      <button class="order-btn">
        <p>Next =></p>
      </button>
    </div>

    <div class="result-card">
      <div class="correct-div">
        <p>
          ✓ Correct: 15
        </p>
      </div>
      <div class="wrong-div">
        <p>
          ✗ Wrong: 5
        </p>
      </div>
      <div>
        <p>
          Overall Progress
        </p>
      </div>
    </div>
    
  </main>
