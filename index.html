<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/script.js" defer></script>
  <title>Vocab Bridge | English-Farsi Learning</title>
</head>

<body>

  <a href="#main-content" class="skip-link">Skip to Content</a>

  <header class="site-header">
  <div class="logo-container">
    <img
      src="assets/images/vocab-bridge-logo.jpg"
      alt="Vocab Bridge"
      class="vocab-bridge-logo"
    >

    <p>
      <strong>Vocab Bridge</strong><br>
      <span id="taglineText">Learn English</span>
    </p>
  </div>

  <div class="header-actions">
    <button
      type="button"
      class="language-switch"
      aria-label="Change language"
    >
      <!-- Language switch icon -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        class="header-icon"
        aria-hidden="true"
        focusable="false"
      >
        <path
          d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <path
          d="M12 2c2.5 2.5 4 5.8 4 10s-1.5 7.5-4 10c-2.5-2.5-4-5.8-4-10s1.5-7.5 4-10Z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <path
          d="M2.5 9h19M2.5 15h19"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
    </button>
  
    <button
      type="button"
      class="day-night-toggle"
      aria-label="Toggle dark and light mode"
    >
      <!-- Day/night toggle icon -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        class="header-icon"
        aria-hidden="true"
        focusable="false"
      >
        <path
          d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </div>
</header>

<div class="progress-track" role="presentation">
  <div class="progress-fill" id="progressFill"></div>
</div>

<!-- Level selection screen -->
<section id="levelSelect" class="selector-screen">
  <h2>Choose a Level</h2>
  <div class="selector-grid" id="levelGrid"></div>
</section>

<!-- Set selection screen -->
<section id="setSelect" class="selector-screen" hidden>
  <button type="button" class="back-btn" id="backToLevels">← Levels</button>
  <h2 id="setSelectTitle">A1 Sets</h2>
  <button type="button" class="review-btn" id="reviewMistakesBtn">🔁 Review Mistakes</button>
  <div class="selector-grid" id="setGrid"></div>
</section>

<main id="main-content" hidden>

  <button type="button" class="back-btn" id="backToSets">← Sets</button>

  <div class="card-counter" aria-live="polite">
    <p>Card 1 of 5</p>
  </div>

  <div class="main-card">
    <div class="card-inner" id="cardInner">

      <!-- Front face -->
      <div class="card-face card-front">
        <div class="top-button-sign">

          <div>
            <button
              type="button"
              class="voice-sign"
              aria-label="Play pronunciation"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M11 5 6 9H3v6h3l5 4V5Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M15 9.5a4 4 0 0 1 0 5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <path
                  d="M18 7a7 7 0 0 1 0 10"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>

          <div>
            <button
              type="button"
              class="restart-quiz"
              aria-label="Restart quiz"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M17 2l4 4-4 4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M3 11V9a3 3 0 0 1 3-3h15"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M7 22l-4-4 4-4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M21 13v2a3 3 0 0 1-3 3H3"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>

        </div>

        <div class="words-btn-container">
          <div class="test-word-container">
            <p class="test-word" id="testWord" lang="en" dir="ltr">friend</p>
          </div>
          <button
            type="button"
            class="flip-card-btn"
            id="flipBtn"
            aria-label="Flip flashcard"
          >
            Flip Card
          </button>
        </div>
      </div>

      <!-- Back face -->
      <div class="card-face card-back">
        <p class="test-word" id="testWordBack" lang="en" dir="ltr">friend</p>
        <p class="test-translation" lang="fa" dir="rtl" id="testTranslation">دوست</p>
        <ul class="example-list" id="exampleList" lang="en" dir="ltr">
          <li>You are my best friend.</li>
          <li>She made a new friend at school.</li>
        </ul>
        <div class="answer-buttons">
          <button type="button" class="answer-btn correct-btn" id="correctBtn">
            I knew it ✓
          </button>
          <button type="button" class="answer-btn wrong-btn" id="wrongBtn">
            I didn't know ✗
          </button>
        </div>
      </div>

    </div>
  </div>

  <div class="previous-next-btn">
    <button type="button" class="order-btn">
      <span aria-hidden="true">←</span>
      <span id="prevLabel">Previous</span>
    </button>

    <button type="button" class="order-btn">
      <span id="nextLabel">Next</span>
      <span aria-hidden="true">→</span>
    </button>
  </div>

  <section class="result-card" aria-label="Learning progress" aria-live="polite">
    <div class="correct-div">
      <p>
        <span aria-hidden="true">✓</span>
        <span id="correctCount">Correct: 0</span>
      </p>
    </div>

    <div class="wrong-div">
      <p>
        <span aria-hidden="true">✗</span>
        <span id="wrongCount">Wrong: 0</span>
      </p>
    </div>

    <div class="progress-summary">
      <svg viewBox="0 0 36 36" class="donut-chart" aria-hidden="true">
        <circle class="donut-bg" cx="18" cy="18" r="15.9155" />
        <circle class="donut-correct" id="donutCorrect" cx="18" cy="18" r="15.9155" />
        <circle class="donut-wrong" id="donutWrong" cx="18" cy="18" r="15.9155" />
      </svg>
      <p id="progressLabel">Overall Progress</p>
    </div>
  </section>

</main>
  
  <footer class="main-footer">
    <div class="footer-social">
        <a href="mailto:armani.ali@proton.me" class="footer-icon-link" aria-label="Email">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="footer-icon" aria-hidden="true">
                <path d="M1.5 8.67v8.58a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V8.67l-10.5 6.3-10.5-6.3Z"/>
                <path d="M22.5 6.908V6.75a3 3 0 0 0-3-3h-15a3 3 0 0 0-3 3v.158l10.5 6.3 10.5-6.3Z"/>
            </svg>
        </a>
        <a href="https://linkedin.com/in/aliarmani" target="_blank" rel="noopener noreferrer" class="footer-icon-link" aria-label="LinkedIn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="footer-icon" aria-hidden="true">
                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124zM7.114 20.452H3.558V9h3.556v11.452z"/>
            </svg>
        </a>
        <a href="https://github.com/Ali-Armani" target="_blank" rel="noopener noreferrer" class="footer-icon-link" aria-label="GitHub">

            </svg>
        </a>
        <a href="https://t.me/ali_armani_dev" target="_blank" rel="noopener noreferrer" class="footer-icon-link" aria-label="Telegram">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="footer-icon" aria-hidden="true">
                <path d="M23.91 3.79 20.3 20.84c-.25 1.21-.98 1.5-2 .94l-5.5-4.07-2.66 2.57c-.3.3-.55.56-1.1.56l.4-5.56 10.1-9.15c.44-.4-.1-.61-.68-.22L7.72 13.3 2.28 11.6c-1.18-.38-1.2-1.18.24-1.75l17.44-6.7c.98-.38 1.84.23 1.94 1.64z"/>

        <p class="footer-copyright">© <span id="footer-year"></span> Ali Armani</p>
    </div>
      
  </footer>

  <!-- Celebration animation container -->
  <div class="celebration" id="celebration" aria-hidden="true"></div>
  
</body>

</html>
